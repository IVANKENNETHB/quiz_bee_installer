[package]
name = "quiz-bee"
version = "1.0.0"
description = "Cybersecurity Quiz Bee desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quiz_bee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
